<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDC Community</title>
    <link rel="icon" type="image/png" href="assets/ydc.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0a0a0c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .icon {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            border: 2px solid #ff6b00;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.35);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn-discord {
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            color: #ffffff;
            padding: 1.1rem 2.8rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 0, 0.6);
            background: linear-gradient(135deg, #e05e00, #ff6b00);
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <main class="container">
        <img src="assets/ydc.png" alt="YDC Icon" class="icon">
        <a href="https://discord.gg/wHAc9uk8" target="_blank" class="btn-discord">
            Discord Server
        </a>
    </main>

</body>
</html>

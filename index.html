<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDC Community</title>
    <link rel="icon" type="image/png" href="assets/ydc.png">
    <style>
        :root {
            --accent: #ff6b00;
            --accent-hover: #e05e00;
            --bg-dark: #0a0a0c;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .background-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--accent);
        }

        .brand span {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-discord {
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-discord:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.5);
            background: linear-gradient(135deg, #e05e00, #ff6b00);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            max-width: 750px;
        }

        .hero-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin-bottom: 2rem;
            border: 2px solid var(--accent);
            box-shadow: 0 0 35px rgba(255, 107, 0, 0.35);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.25rem;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <header>
        <a href="#" class="brand">
            <img src="assets/ydc.png" alt="YDC Community Icon">
            <span>YDC</span>
        </a>
        <a href="https://discord.gg/wHAc9uk8" target="_blank" class="btn-discord">
            Join Discord
        </a>
    </header>

    <main>
        <section class="hero">
            <img src="assets/ydc.png" alt="YDC Logo" class="hero-icon">
            <h1>Welcome to <span>YDC Community</span></h1>
            <p>Connect with passionate members, share ideas, and stay updated in our official Discord server.</p>
            <a href="https://discord.gg/wHAc9uk8" target="_blank" class="btn-discord" style="padding: 1.1rem 2.8rem; font-size: 1.15rem;">
                Enter Discord Server
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 YDC Community. All rights reserved.</p>
    </footer>

</body>
</html>
